services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: crypto-strategy-lab-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: crypto_strategy_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_strategy_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto-strategy-lab-redis
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: crypto-strategy-lab-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: timescaledb
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: crypto_strategy_lab
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Executes search/crawl jobs pulled off Redis (BullMQ) — see
  # artifacts/queue.md. Same image as `api`, different entry point/command,
  # so the two processes can never drift out of sync on dependencies.
  worker:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: crypto-strategy-lab-worker
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_HOST: timescaledb
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: crypto_strategy_lab
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  timescaledb_data:
  redis_data:
