services:
  timescaledb:
    image: timescale/timescaledb-ha:pg18
    container_name: crypto-strategy-lab-db
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: crypto_strategy_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crypto_strategy_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: crypto-strategy-lab-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_HOST: timescaledb
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: crypto_strategy_lab
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  timescaledb_data:
