<!DOCTYPE html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Strategy Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">Crypto <em>Strategy Lab</em></div>
      <div class="market-context">
        <div class="ctx ctx-static">
          <span>Sàn</span>
          <strong>Binance</strong>
        </div>
        <div class="ctx ctx-static">
          <span>Pair</span>
          <strong data-pair-label>BTCUSDT</strong>
        </div>
        <div class="price-stack">
          <span class="price">118,150.2</span>
          <span class="change up">+2.41%</span>
        </div>
        <span class="badge-live">Realtime</span>
      </div>
      <div class="header-spacer"></div>
      <button type="button" class="theme-toggle" data-theme-toggle>
        Theme · <strong data-theme-label>Dark</strong>
      </button>
    </header>

    <div class="app-frame" id="app-frame" data-layout="1">
      <main class="chart-stage" id="chart-stage">
        <div class="chart-toolbar" id="chart-toolbar">
          <div class="toolbar-group">
            <span class="label">Overlays</span>
            <div class="overlay-toggles" role="group" aria-label="Overlays">
              <label class="overlay-chip">
                <input type="checkbox" data-overlay="ma" checked />
                <span>MA</span>
              </label>
              <label class="overlay-chip">
                <input type="checkbox" data-overlay="bb" />
                <span>Bollinger</span>
              </label>
              <label class="overlay-chip">
                <input type="checkbox" data-overlay="sr" />
                <span>S/R</span>
              </label>
            </div>
          </div>
          <div class="layout-controls">
            <span class="label">Layout</span>
            <div class="layout-seg" role="group" aria-label="Layout">
              <button type="button" data-layout-btn="1" class="active">1</button>
              <button type="button" data-layout-btn="2">2</button>
              <button type="button" data-layout-btn="4">4</button>
            </div>
          </div>
        </div>
        <div class="charts-grid" id="charts-grid" data-count="1"></div>
      </main>

      <aside class="right-dock" id="right-dock" aria-label="Workspace panels">
        <div class="dock-header">
          <nav class="dock-tabs" aria-label="Panel">
            <button type="button" class="dock-tab" data-panel-tab="lab" aria-selected="true">Lab</button>
            <button type="button" class="dock-tab" data-panel-tab="strategy" aria-selected="false">Strategy</button>
            <button type="button" class="dock-tab" data-panel-tab="news" aria-selected="false">News</button>
          </nav>
        </div>
        <div class="dock-body" id="dock-body"></div>
      </aside>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/chart-workspace.js"></script>
    <script src="assets/js/panels/lab.js"></script>
    <script src="assets/js/panels/strategy.js"></script>
    <script src="assets/js/panels/news.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
