<!DOCTYPE html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charts — Crypto Strategy Lab</title>
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">Crypto <em>Strategy Lab</em></div>
      <div class="market-context">
        <label class="ctx">
          <span>Sàn</span>
          <select data-exchange aria-label="Exchange">
            <option value="binance">Binance</option>
            <option value="okx">OKX (mở rộng)</option>
            <option value="bybit">Bybit (mở rộng)</option>
          </select>
        </label>
        <label class="ctx">
          <span>Pair</span>
          <select data-pair aria-label="Trading pair">
            <option value="BTCUSDT">BTCUSDT</option>
            <option value="ETHUSDT">ETHUSDT</option>
          </select>
        </label>
        <div class="price-stack">
          <span class="price">118,150.2</span>
          <span class="change up">+2.41%</span>
        </div>
        <span class="badge-live">Realtime</span>
      </div>
      <nav class="workspace-nav" aria-label="Workspace">
        <a href="charts.html" data-nav="charts.html">Charts</a>
        <a href="lab.html" data-nav="lab.html">Lab</a>
        <a href="strategy.html" data-nav="strategy.html">Strategy</a>
        <a href="news.html" data-nav="news.html">News</a>
      </nav>
      <div class="header-spacer"></div>
      <button type="button" class="theme-toggle" data-theme-toggle>
        Theme · <strong data-theme-label>Dark</strong>
      </button>
    </header>

    <div class="workspace">
      <div class="workspace-toolbar">
        <span class="label">Overlays</span>
        <div class="overlay-toggles">
          <label><input type="checkbox" data-overlay="ma" checked /> MA</label>
          <label><input type="checkbox" data-overlay="bb" /> Bollinger</label>
          <label><input type="checkbox" data-overlay="sr" /> Support / Resistance</label>
        </div>
        <div class="layout-controls">
          <span class="label">Layout</span>
          <button type="button" id="remove-panel" title="Bớt panel">− Panel</button>
          <span class="count" id="panel-count">4 / 4 panel</span>
          <button type="button" id="add-panel" title="Thêm panel">+ Panel</button>
        </div>
      </div>
      <div class="charts-grid" id="charts-grid" data-count="4"></div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="assets/js/mock-data.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/charts-page.js"></script>
  </body>
</html>
